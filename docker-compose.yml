services:
  labora-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: labora-backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - .:/app
      - labora_storage:/app/storage
    depends_on:
      - labora-postgres
    networks:
      - labora-network

  labora-postgres:
    image: postgres:16-alpine
    container_name: labora-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-labora_db}
      POSTGRES_USER: ${POSTGRES_USER:-labora}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-labora_password}
    ports:
      - "5432:5432"
    volumes:
      - labora_postgres_data:/var/lib/postgresql/data
    networks:
      - labora-network

volumes:
  labora_postgres_data:
  labora_storage:

networks:
  labora-network:
    driver: bridge
