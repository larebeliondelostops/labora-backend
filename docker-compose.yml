services:
  labora-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: labora-backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - .:/app
      - labora_storage:/app/storage
    depends_on:
      labora-postgres:
        condition: service_started
      labora-minio:
        condition: service_started
      labora-minio-init:
        condition: service_completed_successfully
    networks:
      - labora-network

  labora-postgres:
    image: postgres:16-alpine
    container_name: labora-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-labora_db}
      POSTGRES_USER: ${POSTGRES_USER:-labora}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-labora_password}
    ports:
      - "5432:5432"
    volumes:
      - labora_postgres_data:/var/lib/postgresql/data
    networks:
      - labora-network

  labora-minio:
    image: minio/minio
    container_name: labora-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-labora_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-labora_minio_password}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - labora_minio_data:/data
    networks:
      - labora-network

  labora-minio-init:
    image: minio/mc
    container_name: labora-minio-init
    depends_on:
      - labora-minio
    env_file:
      - .env
    environment:
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-labora_minio}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-labora_minio_password}
      MINIO_BUCKET: ${MINIO_BUCKET:-documents}
    entrypoint: ["/bin/sh", "-c"]
    command: |
      set -e
      until mc alias set labora http://labora-minio:9000 "$${MINIO_ACCESS_KEY}" "$${MINIO_SECRET_KEY}"; do
        sleep 2
      done
      mc mb --ignore-existing "labora/$${MINIO_BUCKET}"
      mc anonymous set none "labora/$${MINIO_BUCKET}"
      cat > /tmp/cors.xml <<'EOF'
      <CORSConfiguration>
        <CORSRule>
          <AllowedOrigin>http://localhost:3000</AllowedOrigin>
          <AllowedOrigin>https://labora.centralspike.com</AllowedOrigin>
          <AllowedMethod>GET</AllowedMethod>
          <AllowedMethod>PUT</AllowedMethod>
          <AllowedMethod>POST</AllowedMethod>
          <AllowedMethod>HEAD</AllowedMethod>
          <AllowedHeader>*</AllowedHeader>
          <ExposeHeader>ETag</ExposeHeader>
          <MaxAgeSeconds>3600</MaxAgeSeconds>
        </CORSRule>
      </CORSConfiguration>
      EOF
      mc cors set "labora/$${MINIO_BUCKET}" /tmp/cors.xml
    networks:
      - labora-network

volumes:
  labora_postgres_data:
  labora_storage:
  labora_minio_data:

networks:
  labora-network:
    driver: bridge
